# The deploy check (scripts/smoke.mjs): after every production deploy, sign in
# as the automated-check system account and open every screen it can reach.
# Any server error fails this job.
#
# Vercel's Deployment Checks would hold a deploy back until this passes, but
# that setting is not on this plan's project (owner, 28 Sept 2026), so the
# deploy goes out first and this check runs after it. When it fails, the job
# puts production back on the deployment that was serving before and says so
# in an issue - a broken screen is live for the length of one check, not until
# somebody notices.
#
# Three jobs rather than one, and the shape matters:
#
#   live   is there anything to check, and is production actually serving this
#          commit? Its own job so that "nothing to check" shows as a *skipped*
#          smoke job rather than a green one (owner, 18 Nov 2026). A green tick
#          on a run that opened no screens is the one thing this must not show.
#   smoke  opens every screen, and puts production back if one is broken.
#   idle   times every screen, and never rolls anything back: a screen that is
#          slow is not a screen that is broken.
#
# Secrets (Settings → Secrets and variables → Actions), held nowhere else:
#   SMOKE_EMAIL, SMOKE_PASSWORD       the automated-check account
#   SMOKE_BILLING_EMAIL,              the second one, which is Billing: a role
#   SMOKE_BILLING_PASSWORD            only sees its own screens, and without
#                                     these six Billing screens are opened by
#                                     nobody. The run says so when they are
#                                     missing rather than passing quietly.
#   SMOKE_REPORTS_EMAIL,              Margaret's role for the billing actions
#   SMOKE_REPORTS_PASSWORD            below: Intake & Reports with a grant,
#                                     which is not a system account and so is
#                                     not one of the two above. Never set, so
#                                     no billing action is posted on any
#                                     deploy; the check says so loudly.
#                                     A third *check* account was made for the
#                                     timing job and dropped (0296) - Intake &
#                                     Reports timed no screen Job Search did
#                                     not. The twelve HR and Admin screens are
#                                     timed by nobody, and the run names them.
#   SUPABASE_URL, SUPABASE_ANON_KEY   the project's public URL and anon key
#   VERCEL_TOKEN                      only for the rollback; without it the
#                                     check still fails and still opens the
#                                     issue, it just cannot move production
#   VERCEL_AUTOMATION_BYPASS_SECRET   only for a hand-run check pointed at
#                                     a per-deployment address, which is
#                                     protected; the address staff use is not
name: smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "Deployment to check"
        required: true
        default: "https://crm.zionvocrehab.com"

permissions:
  contents: read
  issues: write

jobs:
  # ── is there anything to check? ────────────────────────────
  # Everything that can answer "no screens were opened" lives here, so that
  # the answer is one skipped job with a reason rather than a green tick on a
  # job that stepped aside halfway through.
  #
  # Vercel's per-deployment address is behind Deployment Protection, and
  # answers an automated caller with Vercel's own sign-in page - which the
  # check read as "every screen is broken" (28 Sept 2026). So the check opens
  # the address staff use, and that means waiting for production to be moved
  # onto the commit that just went out before opening anything.
  live:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      ready: ${{ steps.ask.outputs.ready }}
      why: ${{ steps.ask.outputs.why }}
    steps:
      # Until the automated-check account exists and its secrets are set, the
      # check steps aside with a notice instead of failing every deploy
      # (owner, 21 Sept 2026). Once SMOKE_EMAIL is set it runs, and fails.
      - name: Is there anything to check?
        id: ask
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SITE: https://crm.zionvocrehab.com
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          nothing() {
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "why=$1" >> "$GITHUB_OUTPUT"
            echo "::notice title=Nothing was checked::$1"
            {
              echo "### Nothing was checked"
              echo ""
              echo "$1"
              echo ""
              echo "The deploy check and the timing are skipped, not passed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          if [ -z "$SMOKE_EMAIL" ] || [ -z "$SMOKE_PASSWORD" ]; then
            nothing "No SMOKE_EMAIL / SMOKE_PASSWORD secret, so no screen was opened. Run scripts/create-check-account.mjs and add the secrets to turn it on."
          fi
          if [ "$EVENT" != "deployment_status" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "a hand-run check, so nothing to wait for"
            exit 0
          fi
          want="$(echo "$SHA" | cut -c1-7)"
          for i in $(seq 1 30); do
            live="$(curl -fsS "$SITE/api/version" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' || true)"
            if [ "$live" = "$want" ]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "production is serving $want"
              exit 0
            fi
            sleep 10
          done
          nothing "Production never moved to $want within five minutes - a later deploy has probably taken its place. No screens were opened."

  smoke:
    needs: live
    if: needs.live.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # The phone screens are measured at 375px in a real browser (owner,
      # 11 Nov 2026); check-phone.mjs can only read the source before a build.
      - run: npx playwright install --with-deps chromium

      - name: Open every screen as the automated check
        id: screens
        env:
          SMOKE_BASE_URL: ${{ github.event_name == 'deployment_status' && 'https://crm.zionvocrehab.com' || inputs.url }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_BILLING_EMAIL: ${{ secrets.SMOKE_BILLING_EMAIL }}
          SMOKE_BILLING_PASSWORD: ${{ secrets.SMOKE_BILLING_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -o pipefail
          node --experimental-strip-types scripts/smoke.mjs 2>&1 | tee smoke.log

      - name: What the check saw
        if: always()
        run: |
          {
            echo "### Deploy check"
            echo ""
            echo '```'
            tail -60 smoke.log 2>/dev/null || echo "the check did not get as far as opening a screen"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── when a screen is broken ─────────────────────────────
      # Production goes back to the deployment that was serving before this
      # commit went out.
      #
      # Gated on the screens step itself having failed (owner, 18 Nov 2026).
      # It used to fire on any failure in the job, so a runner that could not
      # install Playwright rolled production back off a deployment nothing had
      # found a single fault in - and said nothing, because the issue below
      # has always been gated this way. Rolling production back is for a
      # screen that threw, and nothing else.
      #
      # Only for a real deploy: a hand-run check may be pointed at anything,
      # and pointing it at a preview is not a reason to move production.
      #
      # Vercel's API rather than its CLI (drill, 28 Sept 2026: `vercel link`
      # failed in the runner and took the step down with it, before anything
      # had been rolled back). Every answer is written to rollback.log, which
      # the issue below carries, because the one place this runs is the one
      # place nobody is watching.
      #
      # It is not finished when the promote is accepted - it is finished when
      # the address staff use says the older commit. Anything less is a
      # rollback that reported success and left them on the broken one.
      - name: Put production back
        id: rollback
        if: failure() && steps.screens.outcome == 'failure' && github.event_name == 'deployment_status'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT: zion-crm
          # The team this project is under. An identifier, not a credential:
          # it opens nothing without the token, and looking it up was one more
          # call to get wrong (drill, 28 Sept - it was, and nothing rolled
          # back because of it).
          TEAM: team_oEki7sUFpleifVjGvPVMZNGq
          SITE: https://crm.zionvocrehab.com
          SHA: ${{ github.sha }}
        run: |
          exec > >(tee -a rollback.log) 2>&1
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "There is no VERCEL_TOKEN secret, so production was left on the broken deployment."
            echo "::error title=Could not roll back::Roll back by hand: Vercel → Deployments → the last good one → Promote to Production."
            echo "rolled=no-token" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          api() { curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" "$@"; }

          project="$(api "https://api.vercel.com/v9/projects/$PROJECT?teamId=$TEAM")"
          # Reading a project by name works; promoting one does not (drill,
          # 28 Sept: "Project not found" from the promote, with the same name
          # that had just been read). Its id is in the answer either way.
          pid="$(echo "$project" | jq -r '.id // empty')"
          now="$(echo "$project" | jq -r '.targets.production.id // empty')"
          if [ -z "$now" ]; then echo "could not read the project: $(echo "$project" | head -c 300)"; echo "rolled=failed" >> "$GITHUB_OUTPUT"; exit 0; fi

          list="$(api "https://api.vercel.com/v6/deployments?app=$PROJECT&target=production&state=READY&limit=10&teamId=$TEAM")"
          # Which deployment to go back to is scripts/rollback-target.mjs, so
          # that the answer can be asked of fixtures rather than only of
          # production at four in the morning. It refuses - rather than
          # guessing - when production has already moved past the commit under
          # test, which is how the second rollback of 17 Nov went backwards off
          # a deployment that was fine.
          pick="$(echo "$list" | node scripts/rollback-target.mjs --production "$now" --sha "$SHA")"
          echo "target: $pick"
          prev="$(echo "$pick" | jq -r '.target // empty')"
          prevsha="$(echo "$pick" | jq -r '.sha // empty')"
          if [ -z "$prev" ]; then
            echo "::error title=Did not roll back::$(echo "$pick" | jq -r '.why')"
            echo "rolled=refused" >> "$GITHUB_OUTPUT"
            echo "why=$(echo "$pick" | jq -r '.why')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "production is $now; putting it back on $prev ($prevsha)"

          said="$(api -X POST "https://api.vercel.com/v10/projects/$pid/promote/$prev?teamId=$TEAM")"
          echo "promote: $(echo "$said" | head -c 300)"
          if echo "$said" | jq -e '.error' >/dev/null 2>&1; then
            said="$(api -X POST "https://api.vercel.com/v9/projects/$pid/rollback/$prev?teamId=$TEAM")"
            echo "rollback: $(echo "$said" | head -c 300)"
          fi
          for i in $(seq 1 18); do
            live="$(curl -fsS "$SITE/api/version" | jq -r '.commit // empty' || true)"
            if [ "$live" = "$prevsha" ]; then
              echo "$SITE is serving $live"
              echo "rolled=yes" >> "$GITHUB_OUTPUT"
              echo "rolled_to=$prevsha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "the promote was sent but $SITE is still serving $live"
          echo "rolled=failed" >> "$GITHUB_OUTPUT"

      # Any failure, not only a broken screen. A job that fell over before it
      # opened anything used to end here silently, which is how eight deploys
      # in a row were reported as deployed (the lesson in CLAUDE.md). It now
      # says which of the two happened, and whether production was touched.
      - name: Say so
        if: failure()
        uses: actions/github-script@v7
        env:
          ROLLED: ${{ steps.rollback.outputs.rolled }}
          ROLLED_TO: ${{ steps.rollback.outputs.rolled_to }}
          WHY: ${{ steps.rollback.outputs.why }}
          OUTCOME: ${{ steps.rollback.outcome }}
          SCREENS: ${{ steps.screens.outcome }}
          CHECKED: ${{ github.event_name == 'deployment_status' && 'https://crm.zionvocrehab.com' || inputs.url }}
        with:
          script: |
            const fs = require("fs");
            const read = (f, fallback) => { try { return fs.readFileSync(f, "utf8"); } catch { return fallback; } };
            const log = read("smoke.log", "(the check did not get as far as opening a screen)");
            const failed = log.split("\n").filter((l) => l.includes("FAILED")).join("\n") || log.trim().split("\n").slice(-20).join("\n");
            const by_hand = "Vercel → Deployments → the last good one → Promote to Production.";
            // outcome is what the step did; rolled is what it managed. A step
            // that fell over sets no output at all, and saying nothing about
            // production then would be the worst of the three (drill, 28 Sept).
            const rolled = process.env.OUTCOME === "skipped"
              ? (process.env.SCREENS === "failure"
                  ? "This was a hand-run check, so production was left alone."
                  : "No screen was found broken, so production was left alone.")
              : ({
                  yes: `Production has been put back on ${process.env.ROLLED_TO}, the deployment that was serving before this one.`,
                  refused: `**Production was left where it is** - ${process.env.WHY} Check by hand whether it is serving something broken.`,
                  "no-token": `**Production is still on the broken deployment** - there is no \`VERCEL_TOKEN\` secret to roll it back with. ${by_hand}`,
                  failed: `**Rolling back did not work**, so production is probably still on the broken deployment. ${by_hand}`,
                }[process.env.ROLLED] ?? `**The rollback itself fell over**, so production is probably still on the broken deployment. ${by_hand}`);
            const sha = context.sha.slice(0, 7);
            const broke = process.env.SCREENS === "failure";
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: broke ? `Deploy check failed on ${sha}` : `Deploy check could not run on ${sha}`,
              assignees: ["frweah"],
              body: [
                broke
                  ? `A screen threw a server error on ${process.env.CHECKED} after ${sha} went out.`
                  : `The deploy check for ${sha} fell over before it finished opening screens, so nothing is known about whether ${process.env.CHECKED} works.`,
                "",
                rolled,
                "",
                broke ? "What failed:" : "What it got as far as:",
                "```",
                failed,
                "```",
                "",
                "What the rollback did:",
                "```",
                read("rollback.log", "(the rollback did not run)").trim(),
                "```",
                "",
                `[The run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ].join("\n"),
            });

  # ── how long each screen takes to go quiet ─────────────────
  # A job of its own, deliberately: a fault in this check should not put
  # production back on the previous deployment. Rolling back is for a screen
  # that is broken, and a screen that is slow is not broken.
  idle:
    needs: [live, smoke]
    if: needs.live.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      # Before the real walk, walk a stand-in shell whose shape is the shape
      # that broke it: groups opening one at a time, a pane with a shade over
      # the page, an address that changes a beat after the click. The walk
      # timed four screens of twenty-seven for a month without ever failing,
      # and both faults made it quieter rather than louder - so the thing to
      # check is that it still finds screens at all.
      - name: Does the walk still walk?
        run: |
          set -o pipefail
          node scripts/check-idle-walk.mjs 2>&1 | tee walk.log

      - name: Time every screen from click to quiet
        env:
          SMOKE_BASE_URL: https://crm.zionvocrehab.com
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          # Billing's account has existed since 0129 and this job was not
          # using it, so three Billing screens were "timed by nobody" when the
          # only thing missing was these two lines.
          SMOKE_BILLING_EMAIL: ${{ secrets.SMOKE_BILLING_EMAIL }}
          SMOKE_BILLING_PASSWORD: ${{ secrets.SMOKE_BILLING_PASSWORD }}
          # These two walk every screen a check account can reach. The walk
          # names the twelve that nothing times - HR and Admin, which only
          # Admin reaches and no system account may be Admin (0295) - as a
          # warning rather than a failure.
        run: |
          set -o pipefail
          # --experimental-strip-types because the walk reads the navigation
          # out of lib/roles.ts to name the screens nothing times. A list
          # written down beside it would be right on the day and wrong by the
          # next regrouping.
          node --experimental-strip-types scripts/idle-check.mjs 2>&1 | tee idle.log
      - name: What it timed
        if: always()
        run: |
          {
            echo "### Click to quiet"
            echo ""
            echo '```'
            tail -40 idle.log 2>/dev/null || echo "nothing was timed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
