# The deploy check (scripts/smoke.mjs): after every production deploy, sign in
# as the automated-check system account and open every screen it can reach.
# Any server error fails this job.
#
# Vercel's Deployment Checks would hold a deploy back until this passes, but
# that setting is not on this plan's project (owner, 28 Sept 2026), so the
# deploy goes out first and this check runs after it. When it fails, the job
# puts production back on the deployment that was serving before and says so
# in an issue - a broken screen is live for the length of one check, not until
# somebody notices.
#
# Secrets (Settings → Secrets and variables → Actions), held nowhere else:
#   SMOKE_EMAIL, SMOKE_PASSWORD       the automated-check account
#   SMOKE_BILLING_EMAIL,              the second one, which is Billing: a role
#   SMOKE_BILLING_PASSWORD            only sees its own screens, and without
#                                     these six Billing screens are opened by
#                                     nobody. The run says so when they are
#                                     missing rather than passing quietly.
#   SUPABASE_URL, SUPABASE_ANON_KEY   the project's public URL and anon key
#   VERCEL_TOKEN                      only for the rollback; without it the
#                                     check still fails and still opens the
#                                     issue, it just cannot move production
#   VERCEL_AUTOMATION_BYPASS_SECRET   only for a hand-run check pointed at
#                                     a per-deployment address, which is
#                                     protected; the address staff use is not
name: smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "Deployment to check"
        required: true
        default: "https://crm.zionvocrehab.com"

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Until the automated-check account exists and its secrets are set, the
      # check steps aside with a notice instead of failing every deploy
      # (owner, 21 Sept 2026). Once SMOKE_EMAIL is set it runs, and fails.
      - name: Is the check set up?
        id: ready
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          if [ -z "$SMOKE_EMAIL" ] || [ -z "$SMOKE_PASSWORD" ]; then
            echo "::notice title=Deploy check not set up::No SMOKE_EMAIL / SMOKE_PASSWORD secret yet, so no screens were opened. Run scripts/create-check-account.mjs and add the secrets to turn it on."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.ready.outputs.ready == 'true'
        run: npm ci --ignore-scripts

      # Vercel's per-deployment address is behind Deployment Protection, and
      # answers an automated caller with Vercel's own sign-in page - which the
      # check read as "every screen is broken" (28 Sept 2026). So it opens the
      # address staff use, and first waits for production to be moved onto the
      # commit that just went out.
      - name: Wait for production to be this commit
        id: live
        if: steps.ready.outputs.ready == 'true' && github.event_name == 'deployment_status'
        env:
          SITE: https://crm.zionvocrehab.com
        run: |
          want="$(echo "${{ github.sha }}" | cut -c1-7)"
          for i in $(seq 1 30); do
            live="$(curl -fsS "$SITE/api/version" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' || true)"
            if [ "$live" = "$want" ]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "production is serving $want"
              exit 0
            fi
            sleep 10
          done
          echo "::notice title=Nothing to check::Production never moved to $want within five minutes - a later deploy has probably taken its place. No screens were opened."
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - name: Open every screen as the automated check
        id: screens
        if: steps.ready.outputs.ready == 'true' && steps.live.outputs.ready != 'false'
        env:
          SMOKE_BASE_URL: ${{ github.event_name == 'deployment_status' && 'https://crm.zionvocrehab.com' || inputs.url }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_BILLING_EMAIL: ${{ secrets.SMOKE_BILLING_EMAIL }}
          SMOKE_BILLING_PASSWORD: ${{ secrets.SMOKE_BILLING_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -o pipefail
          node --experimental-strip-types scripts/smoke.mjs 2>&1 | tee smoke.log

      - name: What the check saw
        if: always() && steps.ready.outputs.ready == 'true' && steps.live.outputs.ready != 'false'
        run: |
          {
            echo "### Deploy check"
            echo ""
            echo '```'
            tail -60 smoke.log 2>/dev/null || echo "the check did not get as far as opening a screen"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── when a screen is broken ─────────────────────────────
      # Production goes back to whatever was serving before this deployment.
      # Only for a real deploy: a hand-run check may be pointed at anything,
      # and pointing it at a preview is not a reason to move production.
      #
      # Vercel's API rather than its CLI (drill, 28 Sept 2026: `vercel link`
      # failed in the runner and took the step down with it, before anything
      # had been rolled back). Every answer is written to rollback.log, which
      # the issue below carries, because the one place this runs is the one
      # place nobody is watching.
      #
      # It is not finished when the promote is accepted - it is finished when
      # the address staff use says the older commit. Anything less is a
      # rollback that reported success and left them on the broken one.
      - name: Put production back
        id: rollback
        if: failure() && github.event_name == 'deployment_status'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT: zion-crm
          # The team this project is under. An identifier, not a credential:
          # it opens nothing without the token, and looking it up was one more
          # call to get wrong (drill, 28 Sept - it was, and nothing rolled
          # back because of it).
          TEAM: team_oEki7sUFpleifVjGvPVMZNGq
          SITE: https://crm.zionvocrehab.com
        run: |
          exec > >(tee -a rollback.log) 2>&1
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "There is no VERCEL_TOKEN secret, so production was left on the broken deployment."
            echo "::error title=Could not roll back::Roll back by hand: Vercel → Deployments → the last good one → Promote to Production."
            echo "rolled=no-token" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          api() { curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" "$@"; }

          project="$(api "https://api.vercel.com/v9/projects/$PROJECT?teamId=$TEAM")"
          # Reading a project by name works; promoting one does not (drill,
          # 28 Sept: "Project not found" from the promote, with the same name
          # that had just been read). Its id is in the answer either way.
          pid="$(echo "$project" | jq -r '.id // empty')"
          now="$(echo "$project" | jq -r '.targets.production.id // empty')"
          if [ -z "$now" ]; then echo "could not read the project: $(echo "$project" | head -c 300)"; echo "rolled=failed" >> "$GITHUB_OUTPUT"; exit 0; fi

          list="$(api "https://api.vercel.com/v6/deployments?app=$PROJECT&target=production&state=READY&limit=10&teamId=$TEAM")"
          prev="$(echo "$list" | jq -r --arg now "$now" '[.deployments[] | select(.uid != $now)] | first | .uid // empty')"
          if [ -z "$prev" ]; then echo "nothing earlier to go back to: $(echo "$list" | head -c 300)"; echo "rolled=failed" >> "$GITHUB_OUTPUT"; exit 0; fi
          prevsha="$(echo "$list" | jq -r --arg p "$prev" '.deployments[] | select(.uid == $p) | .meta.githubCommitSha // empty' | cut -c1-7)"
          echo "production is $now; putting it back on $prev ($prevsha)"

          said="$(api -X POST "https://api.vercel.com/v10/projects/$pid/promote/$prev?teamId=$TEAM")"
          echo "promote: $(echo "$said" | head -c 300)"
          if echo "$said" | jq -e '.error' >/dev/null 2>&1; then
            said="$(api -X POST "https://api.vercel.com/v9/projects/$pid/rollback/$prev?teamId=$TEAM")"
            echo "rollback: $(echo "$said" | head -c 300)"
          fi
          for i in $(seq 1 18); do
            live="$(curl -fsS "$SITE/api/version" | jq -r '.commit // empty' || true)"
            if [ "$live" = "$prevsha" ]; then
              echo "$SITE is serving $live"
              echo "rolled=yes" >> "$GITHUB_OUTPUT"
              echo "rolled_to=$prevsha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "the promote was sent but $SITE is still serving $live"
          echo "rolled=failed" >> "$GITHUB_OUTPUT"

      - name: Say so
        if: failure() && steps.screens.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          ROLLED: ${{ steps.rollback.outputs.rolled }}
          ROLLED_TO: ${{ steps.rollback.outputs.rolled_to }}
          OUTCOME: ${{ steps.rollback.outcome }}
          CHECKED: ${{ github.event_name == 'deployment_status' && 'https://crm.zionvocrehab.com' || inputs.url }}
        with:
          script: |
            const fs = require("fs");
            const read = (f, fallback) => { try { return fs.readFileSync(f, "utf8"); } catch { return fallback; } };
            const log = read("smoke.log", "(the check did not get as far as opening a screen)");
            const failed = log.split("\n").filter((l) => l.includes("FAILED")).join("\n") || log.trim().split("\n").slice(-20).join("\n");
            const by_hand = "Vercel → Deployments → the last good one → Promote to Production.";
            // outcome is what the step did; rolled is what it managed. A step
            // that fell over sets no output at all, and saying nothing about
            // production then would be the worst of the three (drill, 28 Sept).
            const rolled = process.env.OUTCOME === "skipped"
              ? "This was a hand-run check, so production was left alone."
              : ({
                  yes: `Production has been put back on ${process.env.ROLLED_TO}, the deployment that was serving before this one.`,
                  "no-token": `**Production is still on the broken deployment** - there is no \`VERCEL_TOKEN\` secret to roll it back with. ${by_hand}`,
                  failed: `**Rolling back did not work**, so production is probably still on the broken deployment. ${by_hand}`,
                }[process.env.ROLLED] ?? `**The rollback itself fell over**, so production is probably still on the broken deployment. ${by_hand}`);
            const sha = context.sha.slice(0, 7);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy check failed on ${sha}`,
              assignees: ["frweah"],
              body: [
                `A screen threw a server error on ${process.env.CHECKED} after ${sha} went out.`,
                "",
                rolled,
                "",
                "What failed:",
                "```",
                failed,
                "```",
                "",
                "What the rollback did:",
                "```",
                read("rollback.log", "(the rollback did not run)").trim(),
                "```",
                "",
                `[The run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ].join("\n"),
            });

  # ── how long each screen takes to go quiet ─────────────────
  # A job of its own, deliberately: a fault in this check should not put
  # production back on the previous deployment. Rolling back is for a screen
  # that is broken, and a screen that is slow is not broken.
  idle:
    needs: smoke
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Is the check set up?
        id: ready
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
        run: |
          if [ -z "$SMOKE_EMAIL" ]; then
            echo "::notice title=No timing::No SMOKE_EMAIL secret, so no screen was timed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.ready.outputs.ready == 'true'
        run: npm ci --ignore-scripts
      - if: steps.ready.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium
      - name: Time every screen from click to quiet
        if: steps.ready.outputs.ready == 'true'
        env:
          SMOKE_BASE_URL: https://crm.zionvocrehab.com
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          set -o pipefail
          node scripts/idle-check.mjs 2>&1 | tee idle.log
      - name: What it timed
        if: always() && steps.ready.outputs.ready == 'true'
        run: |
          {
            echo "### Click to quiet"
            echo ""
            echo '```'
            tail -40 idle.log 2>/dev/null || echo "nothing was timed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
